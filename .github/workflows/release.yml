# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `GPG_PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  get-go-version:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2
      - name: 'Determine Go version'
        id: get-go-version
        run: |
          echo "Found Go $(cat .go-version)"
          echo "go-version=$(cat .go-version)" >> $GITHUB_OUTPUT
  goreleaser:
    needs:
      - get-go-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - name: Describe plugin
        id: plugin_describe
        run: echo "api_version=$(go run . describe | jq -r '.api_version')" >> $GITHUB_OUTPUT
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v5.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f82d6c1c344bcacabba2c841718984797f664a6b # v4.2.0
        with:
          version: latest
          args: release --clean --timeout 120m
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_VERSION: ${{ steps.plugin_describe.outputs.api_version }}
      - name: Install ORAS
        run: |
          go install oras.land/oras/cmd/oras@v1.2.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish release bundle to GitHub Packages (GHCR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          PACKAGE="ghcr.io/${OWNER}/${REPO}"
          BUNDLE="dist/${REPO}_${GITHUB_REF_NAME}_artifacts.tar.gz"

          shopt -s nullglob
          ZIP_FILES=(dist/*.zip)
          CHECKSUM_FILES=(dist/*_SHA256SUMS*)
          if [[ ${#ZIP_FILES[@]} -eq 0 || ${#CHECKSUM_FILES[@]} -eq 0 ]]; then
            echo "Expected release zip/checksum artifacts were not found in dist/"
            exit 1
          fi

          FILES=()
          for file in "${ZIP_FILES[@]}" "${CHECKSUM_FILES[@]}"; do
            FILES+=("${file#dist/}")
          done

          tar -czf "${BUNDLE}" -C dist "${FILES[@]}"

          echo "${GITHUB_TOKEN}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          oras push "${PACKAGE}:${GITHUB_REF_NAME}" \
            --artifact-type application/vnd.hashicorp.packer.plugin.release.v1+tar \
            "${BUNDLE}:application/vnd.hashicorp.packer.plugin.release.layer.v1.tar+gzip"

          if [[ "${GITHUB_REF_NAME}" != *"-"* ]]; then
            oras copy "${PACKAGE}:${GITHUB_REF_NAME}" "${PACKAGE}:latest"
          fi
