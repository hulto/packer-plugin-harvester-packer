# Linux Mint 22 (Zena) preseed — automated ubiquity install for golden image
# Served via cd_files (cidata ISO at /dev/sr1, mounted at /media/mint/PRSEED).
# Boot cmdline must include: automatic-ubiquity file=/media/mint/PRSEED/preseed.cfg

### Locale / keyboard
localechooser localechooser/languagelist select en
localechooser localechooser/languagelist seen true
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string mint-golden
d-i netcfg/get_domain string localdomain
d-i netcfg/link_wait_timeout string 10

### Clock / timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning — wipe disk and use LVM
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Account setup
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Packer User
d-i passwd/username string packer
# plaintext: packer
d-i passwd/user-password-crypted password $6$rounds=4096$h2fIknLzlkGbMltF$u84PnMLL4JkuD67Smu3aWmYTwMvWSzudk3ka9jzMslICg97dDMjowhQTiAsQ7m85nQwJe0j6mVn6jGS6JCGko.
d-i passwd/user-default-groups string sudo audio video plugdev netdev

### Ubiquity-specific: skip all interactive pages
ubiquity ubiquity/summary note
ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/poweroff boolean false

### Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server qemu-guest-agent cloud-init
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

### Finish
d-i finish-install/reboot_in_progress note
ubiquity ubiquity/poweroff boolean true

### Late commands — enable services, seed cloud-init for first-boot provisioning
d-i preseed/late_command string \
  in-target systemctl enable qemu-guest-agent; \
  in-target systemctl enable cloud-init; \
  in-target apt-get clean; \
  echo 'packer ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/packer; \
  chmod 440 /target/etc/sudoers.d/packer
